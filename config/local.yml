app:
  name: myna
  ver: 1.0.0

  host: 0.0.0.0
  port: 8899

# ezboot:with-db:begin
  db_migration:
    auto_migrate: true
# ezboot:with-db:end

  lifecycle:
    ready_timeout: 10s
    drain_timeout: 10s
    close_timeout: 5s

  middleware:
# ezboot:with-db:begin
    mysql:
      default:
        _startup: true
        dsn: "user:password@tcp(127.0.0.1:3306)/myna?charset=utf8mb4&parseTime=true&loc=Local"
# ezboot:with-db:end
    grpc:
      server:
        default:
          addr: ":11211"
          _startup: true
          max_recv_msg_size: 10485760
      client:
        default:
          addr: "127.0.0.1:11211"
          timeout_per_request: "5s"
          with_insecure: true
