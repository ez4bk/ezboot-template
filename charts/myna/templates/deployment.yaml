apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "myna.fullname" . }}
  labels:
    {{- include "myna.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "myna.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "myna.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.http }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.service.grpc }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /_healthy
              port: http
          readinessProbe:
            httpGet:
              path: /_healthy
              port: http
          env:
            - name: EZ_ENV
              value: {{ .Values.ysEnv }}
            - name: EZ_MYSQL_DEFAULT_DSN
              valueFrom:
                secretKeyRef:
                  key: {{ .Values.dataSource.key }}
                  name: {{ .Values.dataSource.name }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
